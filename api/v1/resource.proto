syntax = "proto3";

package kounner.api.v1;

option go_package = "kounner/api/v1";

import "google/protobuf/timestamp.proto";

/*
 * This schema defines the structure for representing Kubernetes objects and events.
 *
 * 1. Identification (Composite Key):
 *    A resource is uniquely identified by the combination of:
 *    {cluster_id, group_version, kind, namespace, name}.
 *    All identification fields are mandatory for both UPSERT and DELETE operations.
 *
 * 2. Data Format:
 *    The 'payload' field must contain the object in JSON format.
 *
 * 3. Event Handling:
 *    - Use ResourceEvent to wrap state changes.
 *    - For DELETE operations, only the Identification fields are required.
 *
 * 4. Indexing:
 *    - 'owner': Used for hierarchical structure tracking.
 *    - 'labels': Used for resource discovery and filtering.
 *    - 'reason': Used for event filtering.
 */

// Operation type for the resource change event
enum Operation {
  UNKNOWN = 0;
  UPSERT = 1; // Create or Update
  DELETE = 2;
}

// ResourceOwner represents the owner of a Kubernetes resource
message ResourceOwner {
  string kind = 1;
  string name = 2;
}

// KubernetesResource represents the state of a Kubernetes object
message KubernetesResource {
  // Identification (Composite Key)
  string cluster_id = 1;
  string group_version = 2;
  string kind = 3;
  string namespace = 4;
  string name = 5;
  
  ResourceOwner owner = 6;        // Owner information for hierarchical tracking
  map<string, string> labels = 7; // Labels for filtering and selection
  
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  
  string reason = 10;             // Reason for events
  bytes payload = 11;             // JSON representation of the Kubernetes object
}

// ResourceEvent wraps a resource with an operation type
message ResourceEvent {
  Operation operation = 1;
  KubernetesResource resource = 2;
  google.protobuf.Timestamp timestamp = 3;
}
