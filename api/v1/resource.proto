syntax = "proto3";

package kounner.api.v1;

option go_package = "kounner/api/v1";

import "google/protobuf/timestamp.proto";

/*
 * This schema defines the structure for representing Kubernetes objects and events.
 *
 * 1. Identification (ResourceID):
 *    A resource is uniquely identified by the combination of:
 *    {cluster_id, group_version, kind, namespace, name}.
 *    This ResourceID must be present in all resource-related messages.
 *
 * 2. Data Format:
 *    The 'payload' field must contain the object in JSON format.
 *
 * 3. Event Handling:
 *    - Use ResourceEvent to wrap state changes.
 *    - For DELETE operations, only the ResourceID is required.
 *
 * 4. Indexing:
 *    - 'owner': Used for hierarchical structure tracking.
 *    - 'labels': Used for resource discovery and filtering.
 *    - 'reason': Used for event filtering.
 */

// Operation type for the resource change event
enum Operation {
  UNKNOWN = 0;
  UPSERT = 1; // Create or Update
  DELETE = 2;
}

// ResourceID represents the unique composite key for a resource
message ResourceID {
  string cluster_id = 1;
  string group_version = 2;
  string kind = 3;
  string namespace = 4;
  string name = 5;
}

// ResourceOwner represents the owner of a Kubernetes resource
message ResourceOwner {
  string kind = 1;
  string name = 2;
}

// KubernetesResource represents the state of a Kubernetes object
message KubernetesResource {
  ResourceID id = 1;              // Composite key for identification
  ResourceOwner owner = 2;        // Owner information for hierarchical tracking
  map<string, string> labels = 3; // Labels for filtering and selection
  string reason = 4;              // Reason for events
  
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;

  bytes payload = 7;              // JSON representation of the Kubernetes object
}

// ResourceEvent wraps a resource with an operation type
message ResourceEvent {
  Operation operation = 1;
  ResourceID id = 2;              // Target resource ID
  KubernetesResource resource = 3;// Full resource state (optional for DELETE)
  google.protobuf.Timestamp timestamp = 4;
}
