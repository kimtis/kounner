syntax = "proto3";

package kounner.api.v1;

option go_package = "kounner/api/v1";

import "api/v1/resource.proto";

// CollectorService handles resource event collection from agents.
service CollectorService {
  // BatchUpsertResourceEvents receives a batch of resource events from an agent.
  rpc BatchUpsertResourceEvents(BatchUpsertResourceEventsRequest) returns (BatchUpsertResourceEventsResponse);
}

// BatchUpsertResourceEventsRequest represents a batch of resource events sent by an agent.
message BatchUpsertResourceEventsRequest {
  string cluster_id = 1;
  repeated ResourceEvent events = 2;
}

// BatchUpsertResourceEventsResponse represents the server's response to a batch upsert.
message BatchUpsertResourceEventsResponse {
  int32 processed_count = 1;
  string message = 2;
}
